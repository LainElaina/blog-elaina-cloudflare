main = ".open-next/worker.js"
name = "blog-elaina-cloudflare"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# 自定义域名配置 (Wrangler 3.0+ 支持)
routes = [
  { pattern = "blog.lainelaina.top", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[build]
command = "corepack pnpm run build:cf"

[observability]
[observability.logs]
enabled = true
# 生产环境低采样，避免免费额度和隐私成本被正常流量放大。
head_sampling_rate = 0.05
invocation_logs = false
persist = false

# 环境变量配置
[vars]
NEXT_PUBLIC_GITHUB_APP_ID = "3163640"
NEXT_PUBLIC_GITHUB_BRANCH = "main"
NEXT_PUBLIC_GITHUB_OWNER = "LainElaina"
NEXT_PUBLIC_GITHUB_REPO = "blog-elaina-cloudflare"